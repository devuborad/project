version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-ai-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=campus_secret
      - DB_NAME=campus_ai
      - JWT_SECRET=campus_ai_super_secret_jwt_key_2026
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - campus-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-ai-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campus-net

  db:
    image: mysql:8.0
    container_name: campus-ai-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=campus_secret
      - MYSQL_DATABASE=campus_ai
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - campus-net

networks:
  campus-net:
    driver: bridge

volumes:
  db_data:
